spring:
  application:
    name: authentication-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  Jackson:
    time-zone: UTC

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver

  jpa:
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  web:
    resources:
      add-mappings: false

  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USER}
    password: ${MQ_PASS}
    virtual-host: /

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

server:
  address: 0.0.0.0
  port: 8080

app:
  issuer: authentication-api
  frontend-url: ${FRONTEND_URL}

  google:
    client-id: ${GOOGLE_CLIENT_ID}

  cookies:
    access-token:
      name: ${ACCESS_TOKEN_COOKIE_NAME}
    session:
      name: ${SESSION_COOKIE_NAME}
    device:
      name: ${DEVICE_COOKIE_NAME}

  secrets:
    access-token:
      value: ${ACCESS_TOKEN_SECRET}
    hmac:
      value: ${HMAC_SECRET}

  mail:
    from: ${MAIL_FROM}

# ============
# DEVELOPMENT
# ============
---
spring:
  config:
    activate:
      on-profile: dev

  mail:
    properties:
      mail:
        SMTP:
          auth: false
          STARTTLS:
            enable: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    clean-disabled: false

# ============
# PRODUCTION
# ============
---
spring:
  config:
    activate:
      on-profile: prod

  mail:
    properties:
      mail:
        SMTP:
          auth: true
          STARTTLS:
            enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    clean-disabled: true