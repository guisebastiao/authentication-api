spring:
  config:
    import: optional:file:.env[.properties]

  mail:
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  flyway:
    clean-disabled: false

springdoc:
  api-docs:
    enabled: true

  swagger-ui:
    enabled: true
