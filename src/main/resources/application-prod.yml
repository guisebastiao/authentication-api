spring:
  mail:
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    baseline-on-migrate: true
    clean-disabled: true

springdoc:
  api-docs:
    enabled: false

  swagger-ui:
    enabled: false